name: Refresh streak cards

on:
  schedule:
    - cron: "15 16 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

jobs:
  streak:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v5

      - name: Fetch streak cards
        env:
          LIGHT_URL: "https://streak-stats.demolab.com/?user=Zyrexam&background=FFFFFF&border=E6E9EF&stroke=E6E9EF&ring=0891B2&fire=F59E0B&currStreakNum=0D1117&sideNums=0D1117&currStreakLabel=57606A&sideLabels=57606A&dates=8B949E&border_radius=22&card_width=560"
          DARK_URL: "https://streak-stats.demolab.com/?user=Zyrexam&background=0D1117&border=21262D&stroke=21262D&ring=22D3EE&fire=F59E0B&currStreakNum=F0F6FC&sideNums=F0F6FC&currStreakLabel=9BA3AB&sideLabels=9BA3AB&dates=6E7681&border_radius=22&card_width=560"
        run: |
          set -euo pipefail

          fetch() {
            url="$1"
            out="$2"
            for attempt in 1 2 3 4 5 6; do
              echo "[$attempt/6] Fetching $out"
              if curl -sfL --max-time 30 "$url" > "$out.tmp" 2>/dev/null; then
                sed -n '/<svg/,$p' "$out.tmp" > "$out.new"
                if head -1 "$out.new" | grep -q '^<svg' \
                  && grep -q '</svg>' "$out.new" \
                  && grep -Eq 'Current Streak|Total Contributions' "$out.new"; then
                  mv "$out.new" "$out"
                  rm -f "$out.tmp"
                  echo "Wrote $out ($(wc -c < "$out") bytes)"
                  return 0
                fi
              fi
              rm -f "$out.tmp" "$out.new"
              sleep 10
            done
            echo "Unable to fetch a valid card for $out after 6 attempts"
            return 1
          }

          fetch "$LIGHT_URL" assets/streak-light.svg
          fetch "$DARK_URL" assets/streak-dark.svg

      - name: Commit updated cards
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/streak-light.svg assets/streak-dark.svg
          if git diff --staged --quiet; then
            echo "No changes"
            exit 0
          fi
          git commit -m "chore(stats): refresh streak cards"
          for attempt in 1 2 3 4 5; do
            if git pull --rebase --autostash origin main && git push; then
              exit 0
            fi
            echo "Push attempt $attempt failed; retrying"
            sleep 5
          done
          exit 1
