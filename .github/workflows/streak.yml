name: Refresh streak cards

on:
  schedule:
    - cron: "15 16 * * *"
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: write

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

jobs:
  streak:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4

      - name: Fetch live streak numbers
        env:
          URL: "https://streak-stats.demolab.com?user=Zyrexam&theme=transparent&hide_border=true"
        run: |
          set -euo pipefail
          for attempt in 1 2 3 4 5 6; do
            echo "[$attempt/6] Fetching streak numbers"
            if curl -sfL --max-time 30 "$URL" > streak.raw 2>/dev/null; then
              TOTAL=$(grep -oP '(?s)<g transform[^>]*>\s*<text[^>]*>\s*\K[\d,]+(?=\s*</text>)' streak.raw | head -n 1 || true)
              CURRENT=$(grep -oP 'Current Streak</text>.*?<g transform[^>]*>\s*<text[^>]*>\s*\K[^<]{1,30}' streak.raw | head -n 1 || true)
              LONGEST=$(grep -oP 'Longest Streak</text>.*?<g transform[^>]*>\s*<text[^>]*>\s*\K[^<]{1,30}' streak.raw | head -n 1 || true)
              if [ -n "${TOTAL:-}" ]; then
                echo "TOTAL=$TOTAL" >> "$GITHUB_ENV"
                echo "CURRENT=${CURRENT:-}" >> "$GITHUB_ENV"
                echo "LONGEST=${LONGEST:-}" >> "$GITHUB_ENV"
                echo "Got TOTAL=$TOTAL CURRENT=$CURRENT LONGEST=$LONGEST"
                exit 0
              fi
            fi
            sleep 10
          done
          echo "Unable to fetch streak numbers after 6 attempts"
          exit 1

      - name: Restyle cards into repo theme
        run: |
          python .github/scripts/build_streak.py

      - name: Commit updated cards
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/streak.svg
          if git diff --staged --quiet; then
            echo "No changes"
            exit 0
          fi
          git commit -m "chore(stats): refresh streak cards"
          for attempt in 1 2 3 4 5; do
            if git pull --rebase --autostash origin main && git push; then
              exit 0
            fi
            echo "Push attempt $attempt failed; retrying"
            sleep 5
          done
          exit 1
