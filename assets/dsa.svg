<svg xmlns="http://www.w3.org/2000/svg" width="560" height="105" viewBox="0 0 900 170" role="img" aria-labelledby="title desc">
  <title id="title">Competitive programming and DSA</title>
  <desc id="desc">800 plus DSA problems solved, 1300 Codeforces rating, 1500 plus CodeChef rating.</desc>
  <defs>
    <linearGradient id="dsa-edge" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#22D3EE"/>
      <stop offset=".5" stop-color="#0891B2"/>
      <stop offset="1" stop-color="#7C3AED"/>
    </linearGradient>
    <filter id="dsa-card" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="6" stdDeviation="10" flood-color="#0D1117" flood-opacity=".16"/>
    </filter>
  </defs>
  <style>
    .frame { fill:#FFFFFF; stroke:url(#dsa-edge); stroke-width:2; }
    .inner { fill:none; stroke:#E6E9EF; stroke-width:1; }
    .big { fill:#0D1117; font:800 40px Verdana, Geneva, DejaVu Sans, sans-serif; text-anchor:middle; }
    .name { fill:#57606A; font:700 13px Verdana, Geneva, DejaVu Sans, sans-serif; text-anchor:middle; letter-spacing:1.4px; }
    .range { fill:#8B949E; font:400 12px Verdana, Geneva, DejaVu Sans, sans-serif; text-anchor:middle; }
    .pop { transform-box:fill-box; transform-origin:center; animation:dsa-pop 3.6s ease-in-out infinite; }
    @keyframes dsa-pop { 0%,100% { transform:scale(.97); } 50% { transform:scale(1.03); } }
    @media (prefers-color-scheme:dark) {
      .frame { fill:#0D1117; }
      .inner { stroke:#21262D; }
      .big { fill:#F0F6FC; }
      .name { fill:#9BA3AB; }
      .range { fill:#6E7681; }
    }
    @media (prefers-reduced-motion:reduce) { .pop { animation:none; } }
  </style>

  <g filter="url(#dsa-card)">
    <rect class="frame" x="8" y="8" width="274" height="154" rx="22"/>
    <rect class="inner" x="16" y="16" width="258" height="138" rx="16"/>
    <text class="name" x="145" y="52">DSA PROBLEMS</text>
    <text class="big pop" x="145" y="104">800+</text>
    <text class="range" x="145" y="132">solved &amp; counting</text>
  </g>

  <g filter="url(#dsa-card)">
    <rect class="frame" x="313" y="8" width="274" height="154" rx="22"/>
    <rect class="inner" x="321" y="16" width="258" height="138" rx="16"/>
    <text class="name" x="450" y="52">CODEFORCES</text>
    <text class="big pop" x="450" y="104">1300+</text>
    <text class="range" x="450" y="132">contest rating</text>
  </g>

  <g filter="url(#dsa-card)">
    <rect class="frame" x="618" y="8" width="274" height="154" rx="22"/>
    <rect class="inner" x="626" y="16" width="258" height="138" rx="16"/>
    <text class="name" x="755" y="52">CODECHEF</text>
    <text class="big pop" x="755" y="104">1500+</text>
    <text class="range" x="755" y="132">DSA rating</text>
  </g>
</svg>
